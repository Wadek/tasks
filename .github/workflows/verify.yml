# Optimize verification — Layer A (API) + Layer B (Playwright)
# Visible on every PR/push when the customer uses GitHub.
name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          playwright install --with-deps chromium
      - name: Run equivalence + browser tests (verbose)
        run: pytest -v --tb=short
